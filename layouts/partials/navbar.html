<header class="site-header">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    <nav class="navbar" aria-label="Main navigation">
        <a class="{{ if .IsHome }}active{{ end }}" href="{{ .Site.Home.RelPermalink }}">Journal</a>
        <a class="{{ if eq .Section "tags" }}active{{ end }}" href="{{ "tags" | relURL }}">Topics</a>
        <a class="{{ if eq .Section "categories" }}active{{ end }}" href="{{ "categories" | relURL }}">Categories</a>
    </nav>
</header>
